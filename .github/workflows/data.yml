name: Daily Data

# สร้างไฟล์ข้อมูลของเว็บใหม่ทุกวัน
#   0. โหลดข้อมูลเกมที่ถอดแล้วจาก branch `gamedata` (เครื่องผู้ดูแลถอดไฟล์ล่าสุดของเกมแล้วส่งขึ้นมา — ที่นี่ไม่มีการถอดไฟล์)
#   1. Ranger Book + Gear Book จากข้อมูลเกมของเราเอง
#   2. อันดับ PvP ทุกลีค (หน้า /meta) — ส่วนเดียวที่ยังดึงจากเว็บอื่น (API ของ rangers.lerico.net)
#   3. เขียนไฟล์ JSON ทั้งหมด (public/data) — ข้อมูลเกมแปลงจาก branch `gamedata`
#      ที่ยังดึงจากเว็บอื่นในขั้นนี้: อัตราใช้ตื่นพลัง/ทาเลนต์ PvP (warmycat) + รายชื่อโฟลเดอร์ของหน้า /res (lerico)
#   4. เก็บผลไว้ใน branch `data` (commit เดียว เขียนทับทุกวัน — repo ไม่บวม)
# จากนั้น workflow "Deploy" จะ build เว็บด้วยข้อมูลชุดใหม่เอง (on: workflow_run)
# อัปข้อมูลเกมชุดใหม่ขึ้น `gamedata` แล้วอยากให้เว็บเปลี่ยนทันที → กด Run workflow ที่นี่ (หรือปุ่ม Sync ในหน้าแอดมิน)
# ⚠ ชื่อขั้น (name:) ด้านล่างต้องตรงกับ KEY_STEPS / STEP_LABEL ใน src/components/AdminBuildLog.tsx

on:
  schedule:
    # ทุกวัน 00:23 UTC = 07:23 น. เวลาไทย
    # ไม่ใช้นาทีที่ 0 — ต้นชั่วโมงคนตั้งงานไว้เยอะ GitHub จึงเลื่อนงานออกไปนาน (เคยช้าไป 3.5–4.5 ชม.)
    # ยังรันหลัง 07:00 เหมือนเดิม ข้อมูลรายวันของเกมจะได้อัปเดตแล้ว
    - cron: '23 0 * * *'
  workflow_dispatch:       # กดรันเองได้ที่ GitHub → Actions หรือปุ่ม Sync ในหน้าแอดมิน

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # ไม่เก็บ token ไว้ใน .git/config — npm ci / สคริปต์ดึงข้อมูลจะได้อ่าน token (สิทธิ์ contents: write) ไม่ได้
          # token ถูกส่งให้เฉพาะขั้น push ตอนท้าย (repo เป็น public จึง fetch branch data ได้โดยไม่ต้องใช้ token)
          persist-credentials: false

      - name: Restore previous data (branch `data`)
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            mkdir -p .data
            git archive FETCH_HEAD db | tar -x -C .data
            echo "restored: $(ls .data/db | tr '\n' ' ')"
          else
            echo "ยังไม่มี branch data — เริ่มจากศูนย์"
          fi

      # ข้อมูลเกม = JSON ที่ถอดจากไฟล์ทางการของเกม (เครื่องผู้ดูแลถอดแล้วส่งขึ้น branch `gamedata` — ที่นี่ไม่มีการถอดไฟล์)
      # เรนเจอร์ / สกิล / ความสามารถ / เกียร์ / ข้อความทุกภาษา / ท่าโจมตี / สายวิวัฒนาการ อ่านจากชุดนี้ทั้งหมด (src/lib/gameData.ts)
      - name: Load game data (branch `gamedata`)
        run: |
          if git ls-remote --exit-code --heads origin gamedata >/dev/null; then
            git fetch --depth=1 origin gamedata
            mkdir -p .gamedata
            git archive FETCH_HEAD | tar -x -C .gamedata
            echo "gamedata: $(node -p "require('./.gamedata/manifest.json').generatedAt") · $(ls .gamedata/db | wc -l) tables"
          else
            echo "::error::ยังไม่มี branch gamedata — รันสคริปต์อัปเดตข้อมูลเกม (--publish) บนเครื่องผู้ดูแลก่อน"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # ข้อมูลเกมของเราเอง (.gamedata) → .data/db/ranger-book.json + gear-book.json
      - name: Sync Ranger Book + Gear Book
        run: npx tsx scripts/sync-rangers.ts
        continue-on-error: true

      # ข้อมูลจากเว็บอื่น: อันดับ + ทีม/เกียร์ผู้เล่น PvP (lerico) → .data/db/league-rankings.json + ranger-gear.json
      - name: Refresh PvP rankings (all leagues)
        run: npx tsx scripts/refresh-pvp.ts
        continue-on-error: true

      - name: Emit static JSON (public/data)
        run: npx tsx scripts/emit-data.ts

      - name: Save to branch `data`
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          DIR="$RUNNER_TEMP/data-branch"
          mkdir -p "$DIR"
          cp -r .data/db "$DIR/db"
          cp -r public/data "$DIR/public-data"
          cd "$DIR"
          git init -q -b data
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" data
          echo "pushed $(find public-data -type f | wc -l) files"
