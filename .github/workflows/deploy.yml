name: Deploy

# build เว็บแบบ static แล้ว deploy ขึ้น GitHub Pages
# รันเมื่อ: push ขึ้น main (รวมถึงตอนแอดมินกดบันทึก — Worker commit ให้), หลัง "Daily Data" เสร็จ, หรือกดรันเอง
#
# ตั้งค่าที่ GitHub → Settings → Secrets and variables → Actions → Variables:
#   WORKER_URL     https://api.ranger-kiwi.com
#   SITE_URL       https://ranger-kiwi.com
#   CUSTOM_DOMAIN  ranger-kiwi.com
#   CF_BEACON_TOKEN  token สคริปต์ Cloudflare Web Analytics (เว้นว่างได้ = ไม่นับสถิติ)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'worker/**'
      - '**.md'
  workflow_run:
    workflows: ['Daily Data']
    types: [completed]
  workflow_dispatch:

# สิทธิ์ขั้นต่ำ: build อ่านโค้ดอย่างเดียว · สิทธิ์ pages/id-token ให้เฉพาะ job deploy
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read   # configure-pages อ่านค่าเว็บ Pages
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Load game data (branch `data`)
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            mkdir -p public/data .data
            git archive FETCH_HEAD public-data | tar -x -C "$RUNNER_TEMP"
            cp -r "$RUNNER_TEMP/public-data/." public/data/
            git archive FETCH_HEAD db | tar -x -C .data
            echo "loaded $(find public/data -type f | wc -l) data files"
          else
            echo "::warning::ยังไม่มี branch data — เว็บจะไม่มีข้อมูลเกมจนกว่า Daily Data จะรันเสร็จ"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # ข้อมูลที่แอดมินแก้ (gacha / top40 / about) — สร้างใหม่จาก content/*.json ทุกครั้ง (ไม่กี่วินาที)
      - name: Emit content JSON
        run: npx tsx scripts/emit-data.ts --content-only

      - name: Build (static export)
        run: npx next build
        env:
          NEXT_PUBLIC_WORKER_URL: ${{ vars.WORKER_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          # Cloudflare Web Analytics (token ของสคริปต์นับคนเข้า — ไม่ใช่ความลับ) · เว้นว่างได้
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}

      - name: Custom domain + no Jekyll
        # ส่งค่าผ่าน env (ไม่แปะ expression ลงในสคริปต์ตรงๆ — กัน script injection)
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          touch out/.nojekyll
          if [ -n "$CUSTOM_DOMAIN" ]; then printf '%s\n' "$CUSTOM_DOMAIN" > out/CNAME; fi

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
