name: Talent Translation Coverage Check

on:
  schedule:
    # ทุกวันจันทร์ 20:00 UTC = 03:00 น. วันอังคาร เวลาไทย
    - cron: '0 20 * * 1'
  workflow_dispatch:
    # กดรัน manual ได้จาก GitHub → Actions

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check-coverage:
    name: Check Talent Translation Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write    # ต้องใช้สร้าง GitHub issue
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run coverage check
        id: check
        # exit 0 = OK, exit 1 = มีคำขาด, exit 2 = error อื่นๆ
        # || true เพื่อไม่ให้ workflow fail แต่เก็บ exit code ไว้
        run: |
          npx tsx scripts/check-talent-coverage.ts
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Create issue if missing translations
        if: steps.check.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const report = `${{ steps.check.outputs.report }}`
            const title = `🌐 Talent translation: missing phrases detected (${new Date().toISOString().slice(0, 10)})`
            const body = [
              '## Auto-detected missing talent translations',
              '',
              'Warmycat อาจอัปเดตเกมและมี phrase ใหม่ที่ยังไม่ได้แปล',
              '',
              '### Report',
              '```json',
              report,
              '```',
              '',
              '### วิธีแก้',
              '1. ดู `topUntranslatedChars` ในรายงาน',
              '2. เปิด `src/lib/talentTranslate.ts`',
              '3. เพิ่ม zh→en/th entries สำหรับ phrase ที่ขาด',
              '4. รัน `npx tsx scripts/check-talent-coverage.ts` ใน local ตรวจซ้ำ',
              '5. push',
              '',
              '_Auto-generated by `.github/workflows/talent-coverage-check.yml`_',
            ].join('\n')

            // เช็คก่อนว่ามี issue เปิดอยู่ไหม (กันสร้างซ้ำทุกสัปดาห์)
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'talent-translation',
            })
            const stale = existing.data.find(iss => iss.title.startsWith('🌐 Talent translation:'))
            if (stale) {
              // อัปเดต comment แทนสร้าง issue ใหม่
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: stale.number,
                body: `### Re-check ${new Date().toISOString().slice(0, 10)}\n\n\`\`\`json\n${report}\n\`\`\``,
              })
              console.log(`Updated existing issue #${stale.number}`)
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['talent-translation', 'auto-detected'],
              })
              console.log(`Created new issue #${created.data.number}`)
            }

      - name: Fail workflow if coverage broken
        if: steps.check.outputs.exit_code == '2'
        run: |
          echo "❌ Script error (exit 2)"
          exit 1
