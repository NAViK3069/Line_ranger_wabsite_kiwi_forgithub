# Cloudflare Worker ของ Line Ranger Kiwi
# deploy:  cd worker && npx wrangler deploy
# ความลับ (ตั้งครั้งเดียว ไม่อยู่ใน repo):
#   npx wrangler secret put ADMIN_PASSWORD
#   npx wrangler secret put SESSION_SECRET
#   npx wrangler secret put GITHUB_TOKEN
name = "line-ranger-kiwi"
main = "src/index.ts"
compatibility_date = "2025-06-01"

[vars]
ADMIN_USERNAME = "admin"
GITHUB_REPO = "NAViK3069/Line_ranger_wabsite_kiwi_forgithub"
GITHUB_BRANCH = "main"
# โดเมนที่เรียก /api/admin/* ได้ (คั่นด้วย ,)
ALLOWED_ORIGINS = "http://localhost:3000,https://ranger-kiwi.com,https://www.ranger-kiwi.com,https://line-ranger-kiwi.kiwi-navik3069.workers.dev"
# ลิงก์เก่า *.workers.dev: Worker ดึงหน้าเว็บจาก GitHub Pages มาให้
# พอ GitHub Pages ตั้ง Custom domain = ranger-kiwi.com แล้ว GitHub จะตอบ 301 ไป ranger-kiwi.com
# และ Worker ส่ง redirect นั้นต่อ → คนที่เปิดลิงก์เก่าถูกพาไปโดเมนใหม่เอง (เก็บบรรทัดนี้ไว้เพื่อการนี้)
PAGES_ORIGIN = "https://navik3069.github.io/Line_ranger_wabsite_kiwi_forgithub"

# Worker อยู่ที่ api.ranger-kiwi.com (Cloudflare สร้าง DNS + ใบรับรองให้ตอน deploy · ได้ edge cache ด้วย)
[[routes]]
pattern = "api.ranger-kiwi.com"
custom_domain = true
